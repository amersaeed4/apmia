title: Home Page (sections)
extends@: default

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            modular_title:
              type: spacer
              title: Section list
              text: 'Each section of the home page is a child page whose folder starts with an underscore. Use "Add Modular" to create a section and drag to reorder.'
            header.content.items:
              type: text
              label: Items
              default: '@self.modular'
              size: medium
            header.content.order.by:
              type: text
              label: Order by
              placeholder: default
              size: small
            header.content.order.dir:
              type: text
              label: Order direction
              placeholder: asc
              size: small
